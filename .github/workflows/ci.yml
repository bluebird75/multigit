name: Continuous Integration

env:
  QT_QPA_PLATFORM: "offscreen"

on:
  push:
    branches: [ snap-packaging ]
  pull_request:
    branches: [ snap-packaging ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run on"
        required: false
        default: "snap-packaging"

jobs:

  test-linux:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported version of python
          - python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/requirements-dev.txt'

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y libegl-mesa0 libgl1 libglx-mesa0 libegl1-mesa-dev
          sudo ls -l /usr/lib/x86_64-linux-gnu/libEGL.so.1
          python -m pip install -r reqs/requirements-dev.txt
          pip list

      - name: run tests
        run: |
          pytest

      - name: run type checking
        run: |
          mypy .

  snap-linux:
    if: github.ref == 'refs/heads/snap-packaging'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install snap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          for attempt in 1 2 3; do
            if sudo snap install core22 --channel=latest/stable; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Retrying core22 installation (attempt $((attempt + 1)) of 3)..."
            sleep $((attempt * 10))
          done
          sudo snap install snapcraft --classic

      - name: Build snap package in devmode
        run: |
          cd packaging/snap
          if ! snapcraft pack --destructive-mode; then
            log_file=$(ls -t ~/.local/state/snapcraft/log/snapcraft-*.log 2>/dev/null | head -n 1)
            if [ -n "$log_file" ]; then
              echo "Snapcraft log: $log_file"
              tail -n 100 "$log_file"
            fi
            exit 1
          fi

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: multigit-snap-dev
          path: packaging/snap/*.snap

  snap-linux-lxd:
    if: github.ref == 'refs/heads/snap-packaging'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up LXD
        uses: canonical/setup-lxd@v1

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap with LXD
        run: snapcraft pack --project-dir packaging/snap

      - name: Upload LXD-built snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: multigit-snap-lxd
          path: packaging/snap/*.snap